<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace parent · Sana</title>
<style>
  :root{--ink:#1d2433;--mut:#6b7385;--bg:#f3f5f9;--card:#fff;--ok:#2e8b45;--mid:#d9a21b;--ko:#c0392b}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:900px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:.2em 0 .6em}h2{font-size:1.05rem;margin:0 0 .6em}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}.kpi b{display:block;font-size:1.5rem}.kpi span{color:var(--mut);font-size:.85rem}
  input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #c8cedb}button{background:#2d4ea2;color:#fff;border:0;cursor:pointer}
  .days{display:flex;align-items:flex-end;gap:6px;height:120px}.days div{flex:1;text-align:center;font-size:.7rem;color:var(--mut)}
  .days i{display:block;background:#6f8be0;border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:7px 4px;border-bottom:1px solid #eceff5;text-align:left}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;color:#fff;font-size:.78rem}.ce2{background:#6a9b78}
  .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tab{background:#e3e8f4;color:var(--ink)}.tab.on{background:#2d4ea2;color:#fff}
  .scroll{overflow-x:auto}
  .muted{color:var(--mut)}.err{color:var(--ko)}.hide{display:none}
</style>
</head>
<body>
<main>
  <p><a href="index.html">← Retour à l'appli de Sana</a></p>
  <h1>👪 Espace parent — suivi de Sana</h1>
  <div id="msg" class="card hide"></div>
  <form id="login" class="card hide">
    <h2>Connexion</h2>
    <p><input id="em" type="email" placeholder="e-mail parent" autocomplete="username" required> <input id="pw" type="password" placeholder="mot de passe" autocomplete="current-password" required> <button>Se connecter</button></p>
    <p id="lerr" class="err"></p>
  </form>
  <div id="dash" class="hide"></div>
  <p><a href="index.html">← Retour à l'appli de Sana</a></p>
</main>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { SKILLS as GS } from './gen.js';
const $ = (id) => document.getElementById(id);
if (!firebaseConfig.apiKey) {
  $('msg').classList.remove('hide');
  $('msg').innerHTML = "Le suivi en ligne n'est pas encore configuré. Suis l'étape 2 du <b>README.md</b> (Firebase), puis remplis <code>firebase-config.js</code>.";
} else {
  const V = '10.12.2';
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  $('login').onsubmit = async (e) => {
    e.preventDefault(); $('lerr').textContent = '';
    try { await A.signInWithEmailAndPassword(auth, $('em').value, $('pw').value); }
    catch { $('lerr').textContent = 'Connexion impossible : vérifie e-mail et mot de passe.'; }
  };
  A.onAuthStateChanged(auth, async (u) => {
    $('login').classList.toggle('hide', !!u); $('dash').classList.toggle('hide', !u);
    if (u) { DATA = await load(); render(); }
  });

  async function load() {
    const q = F.query(F.collection(db, 'sessions'), F.orderBy('startedAt', 'desc'), F.limit(400));
    const snap = await F.getDocs(q);
    const st = await F.getDoc(F.doc(db, 'state', 'sana'));
    const rw = await F.getDoc(F.doc(db, 'config', 'rewards'));
    return { sessions: snap.docs.map(d => d.data()), state: st.exists() ? st.data() : null, rewards: rw.exists() ? rw.data().items : null };
  }

  const SKILL = Object.fromEntries(Object.entries(GS).map(([k, v]) => [k, v.label]));
  const CE2 = new Set(['tables', 'conjPresent']);
  const MODE = { mission:'Mission du jour', maths:'Maths', francais:'Français', sciences:'Sciences', culture:'Culture', anglais:'Anglais', faibles:'Entraînement ciblé', nouveau:'Nouveautés', stitch:'Stitch' };
  const day = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m/60)} h` : `il y a ${Math.round(m/1440)} j`; };
  const hm = (s) => s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${String(Math.round(s / 60) % 60).padStart(2, '0')}`;
  let DATA = null, LEVEL = 'all';
  const DEFAULT_RW = [{ pts: 300, days: 2, label: '🍦 Une glace' }, { pts: 600, days: 4, label: '🍰 Choisir le dessert du dimanche' }, { pts: 1100, days: 6, label: '🏊 Une sortie piscine' }, { pts: 1700, days: 8, label: '🍔 Un petit Quick' }, { pts: 2400, days: 11, label: '📚 Un nouveau livre' }, { pts: 3300, days: 15, label: '🎬 Une sortie cinéma' }, { pts: 4500, days: 19, label: '🎲 Un jeu de société' }, { pts: 6000, days: 25, label: '🍽️ Un petit resto avec papa' }, { pts: 8000, days: 32, label: '🧱 Une boîte de LEGO' }];
  const rwRow = (r) => `<p class="rwr"><input class="rp" type="number" min="10" step="50" value="${r.pts}" style="width:90px"> pts + <input class="rd" type="number" min="0" step="1" value="${r.days || 0}" style="width:70px"> jours <input class="rl" value="${esc(r.label)}" style="width:min(300px,55%)"></p>`;
  const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function summaryText(all) {
    const week = all.filter(s => Date.now() - s.startedAt < 7 * 864e5);
    const sec = week.reduce((a, s) => a + s.durationSec, 0), ans = week.reduce((a, s) => a + s.answered, 0), ok = week.reduce((a, s) => a + s.correct, 0);
    const daysN = new Set(week.map(s => day(s.startedAt))).size;
    const sk = {}; week.forEach(s => Object.entries(s.skills || {}).forEach(([id, r]) => { const a = (sk[id] ||= { ok: 0, tot: 0 }); a.ok += r.ok; a.tot += r.tot; }));
    const r = Object.entries(sk).filter(([, v]) => v.tot >= 3).map(([id, v]) => [SKILL[id] || id, Math.round(v.ok / v.tot * 100)]).sort((a, b) => a[1] - b[1]);
    const st = DATA.state;
    return ['Résumé de la semaine de Sana', '',
      `Temps de travail : ${hm(sec)} sur ${daysN} jour${daysN > 1 ? 's' : ''} (${week.length} séance${week.length > 1 ? 's' : ''})`,
      `Réussite : ${ans ? Math.round(ok / ans * 100) : 0} % sur ${ans} question${ans > 1 ? 's' : ''}`,
      r.length ? `À renforcer : ${r.slice(0, 3).map(([n, p]) => `${n} (${p} %)`).join(', ')}` : 'À renforcer : pas assez de données',
      r.length ? `Points forts : ${r.slice(-3).reverse().map(([n, p]) => `${n} (${p} %)`).join(', ')}` : '',
      st ? `Série : ${st.streak} jour(s) · ${st.points} points · ${st.review || 0} question(s) à revoir` : '',
      st && st.unlocked && st.unlocked.length ? `Récompenses débloquées : ${st.unlocked.join(', ')}` : ''].filter((x, i) => x || i === 1).join('\n');
  }

  function render() {
    const { state } = DATA;
    const sessions = DATA.sessions.filter(s => LEVEL === 'all' || (s.level || 'CM1') === LEVEL);
    const last = sessions[0], todayKey = day(Date.now());
    const week = sessions.filter(s => Date.now() - s.startedAt < 7 * 864e5);
    const weekSec = week.reduce((a, s) => a + s.durationSec, 0);
    const todaySec = sessions.filter(s => day(s.startedAt) === todayKey).reduce((a, s) => a + s.durationSec, 0);
    const totalSec = sessions.reduce((a, s) => a + s.durationSec, 0);
    const ans = sessions.reduce((a, s) => a + s.answered, 0), okq = sessions.reduce((a, s) => a + s.correct, 0);
    const perQ = ans ? Math.round(totalSec / ans) : 0;
    const perDay = {}; sessions.forEach(s => { const k = day(s.startedAt); perDay[k] = (perDay[k] || 0) + s.durationSec / 60; });
    const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push([day(d), d.getDate()]); }
    const mx = Math.max(10, ...days.map(([k]) => perDay[k] || 0));
    const sk = {}; sessions.forEach(s => Object.entries(s.skills || {}).forEach(([id, r]) => { const a = (sk[id] ||= { ok: 0, tot: 0, sec: 0 }); a.ok += r.ok; a.tot += r.tot; a.sec += r.sec || 0; }));
    const rows = Object.entries(sk).filter(([, r]) => r.tot >= 2).sort((a, b) => a[1].ok / a[1].tot - b[1].ok / b[1].tot);
    const col = (p) => p >= 80 ? 'var(--ok)' : p >= 55 ? 'var(--mid)' : 'var(--ko)';
    const pill = (v, l) => `<button class="tab ${LEVEL === v ? 'on' : ''}" data-l="${v}">${l}</button>`;
    $('dash').innerHTML = `
    <p class="tabs">${pill('all', 'Tous niveaux')}${pill('CM1', 'CM1')}${pill('CM2', 'CM2')} <span class="muted">Niveau actuel dans l'appli : ${state && state.level ? state.level : 'CM1'}</span></p>
    <div class="kpis">
      <div class="kpi"><b>${last ? ago(last.startedAt) : '—'}</b><span>Dernière séance</span></div>
      <div class="kpi"><b>${hm(todaySec)}</b><span>de travail aujourd'hui</span></div>
      <div class="kpi"><b>${hm(weekSec)}</b><span>sur 7 jours · ${week.length} séance${week.length > 1 ? 's' : ''}</span></div>
      <div class="kpi"><b>${hm(totalSec)}</b><span>au total · ${sessions.length} séances</span></div>
      <div class="kpi"><b>${ans ? Math.round(okq / ans * 100) : 0} %</b><span>de réussite · ${perQ} s par question</span></div>
      <div class="kpi"><b>${state ? state.streak + ' j' : '—'}</b><span>jours d'affilée · ⭐ ${state ? state.points : 0}</span></div>
    </div>
    <div class="card"><h2>📋 Résumé de la semaine</h2><pre id="sum" style="white-space:pre-wrap;font:inherit;margin:0 0 10px">${esc(summaryText(DATA.sessions))}</pre>
      <button id="cp">Copier</button> <a id="ml" href="#"><button type="button">Envoyer par e-mail</button></a>
      <p class="muted" style="font-size:.8rem;margin-bottom:0">Un e-mail <i>automatique</i> chaque semaine demanderait un petit serveur (hors de ce projet gratuit) : ici, un clic ouvre ta messagerie avec le texte prêt.</p></div>
    <div class="card"><h2>🎁 Récompenses de Sana</h2>
      <p class="muted" style="margin-top:0">Elle les voit à l'accueil (« prochaine récompense »). Une récompense se débloque quand Sana a assez de <b>points</b> ET assez de <b>jours de travail</b> (jour = 5 min ou plus), pour qu'elle ne l'obtienne pas en un après-midi. ${state && state.unlocked && state.unlocked.length ? `<br>Déjà débloquées : <b>${state.unlocked.map(esc).join(' · ')}</b>` : ''}</p>
      <div id="rwed">${(DATA.rewards && DATA.rewards.length ? DATA.rewards : DEFAULT_RW).map(rwRow).join('')}</div>
      <button id="rwadd" class="tab">+ Ajouter</button> <button id="rwsave">Enregistrer</button> <span id="rwm" class="muted"></span></div>
    <div class="card"><h2>🔁 À revoir</h2><p style="margin:0">${state && state.review != null ? `${state.review} question${state.review > 1 ? 's' : ''} en révision espacée (ratées, reproposées à J+1, 3, 7, 14).` : '—'}</p></div>
    <div class="card"><h2>Minutes par jour (14 derniers jours)</h2>
      <div class="days">${days.map(([k, d]) => `<div><i style="height:${Math.round((perDay[k] || 0) / mx * 100)}px" title="${Math.round(perDay[k] || 0)} min"></i>${d}</div>`).join('')}</div></div>
    <div class="card"><h2>Compétences (du plus fragile au plus solide)</h2>
      ${rows.length ? `<div class="scroll"><table><tr><th>Compétence</th><th>1er essai</th><th>Questions</th><th>Temps / question</th></tr>${rows.map(([id, r]) => { const p = Math.round(r.ok / r.tot * 100); return `<tr><td>${SKILL[id] || id} ${CE2.has(id) ? '<span class="pill ce2">révision CE2</span>' : ''}</td><td><span class="pill" style="background:${col(p)}">${p} %</span></td><td>${r.tot}</td><td>${r.sec ? Math.round(r.sec / r.tot) + ' s' : '—'}</td></tr>`; }).join('')}</table></div>` : '<p class="muted">Pas encore assez de données.</p>'}</div>
    <div class="card"><h2>Dernières séances</h2>
      ${sessions.length ? `<div class="scroll"><table><tr><th>Quand</th><th>Type</th><th>Niveau</th><th>Score</th><th>Durée</th></tr>${sessions.slice(0, 15).map(s => `<tr><td>${new Date(s.startedAt).toLocaleString('fr-FR', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</td><td>${MODE[s.mode] || s.mode}</td><td>${s.level || 'CM1'}</td><td>${s.correct}/${s.answered}</td><td>${s.durationSec < 90 ? s.durationSec + ' s' : Math.round(s.durationSec / 60) + ' min'}</td></tr>`).join('')}</table></div>` : '<p class="muted">Aucune séance pour le moment.</p>'}</div>`;
    document.querySelectorAll('.tab[data-l]').forEach(b => b.onclick = () => { LEVEL = b.dataset.l; render(); });
    $('cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('sum').textContent).then(() => { $('cp').textContent = 'Copié ✓'; }); };
    $('ml').href = 'mailto:?subject=' + encodeURIComponent('Résumé de la semaine de Sana') + '&body=' + encodeURIComponent($('sum').textContent);
    $('rwadd').onclick = () => { $('rwed').insertAdjacentHTML('beforeend', rwRow({ pts: 10000, days: 40, label: '' })); };
    $('rwsave').onclick = async () => {
      const items = [...document.querySelectorAll('.rwr')].map(p => ({ pts: Math.round(+p.querySelector('.rp').value), days: Math.max(0, Math.round(+p.querySelector('.rd').value || 0)), label: p.querySelector('.rl').value.trim().slice(0, 60) })).filter(r => r.pts > 0 && r.label);
      try { await F.setDoc(F.doc(db, 'config', 'rewards'), { items }); DATA.rewards = items; $('rwm').textContent = 'Enregistré ✓ (visible sur l\'iPad à la prochaine ouverture)'; }
      catch { $('rwm').textContent = 'Échec : vérifie que les règles Firestore ont été republiées.'; }
    };
  }
}
</script>
</body>
</html>
